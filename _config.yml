url: "https://lawless-design-labs.github.io"
baseurl: "/underfoot"

permalink: pretty
title: "Underfoot"
description: "Small game about a field mouse’s sunflower garden"

sass:
  style: compressed

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
